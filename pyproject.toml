requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "wbgapi>=1.0.12",
  "requests>=2.31",
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "py7zr>=0.20",
  "lxml>=5.0",
]

[tool.setuptools]
py-modules = []
