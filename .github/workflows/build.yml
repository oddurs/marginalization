name: Build paper

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the PDF to tagged releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install .

      - name: Install TeX Live (LuaLaTeX, biber, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-pictures \
            texlive-fonts-extra texlive-bibtex-extra texlive-science \
            biber latexmk lmodern poppler-utils

      # Raw downloads are cached so rebuilds use the same vintage of data.
      # Bump the key suffix to force a fresh download.
      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('scripts/fetch_*.py') }}-v1

      - name: Run pipeline and compile (fails on any \placeholder)
        run: make data figures final

      - name: Check page size is US Letter
        run: pdfinfo widening-edge.pdf | grep -q "612 x 792 pts (letter)"

      - name: Show data changes against committed outputs
        run: git diff --stat -- data/processed generated || true

      - uses: actions/upload-artifact@v4
        with:
          name: widening-edge
          path: widening-edge.pdf

      - name: Attach PDF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: widening-edge.pdf
